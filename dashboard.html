<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>LinkNova Dashboard</title>

<link
  rel="stylesheet"
  href="style.css"
>

<style>

.dashboard {

  max-width:1200px;

  margin:auto;

  padding:70px 25px;

}

.dashboardHeader {

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:35px;

}

.dashboardHeader h1 {

  font-size:42px;

  letter-spacing:-2px;

}

.stats {

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:18px;

}

.stat {

  padding:25px;

  border-radius:20px;

  background:
    rgba(255,255,255,.05);

  border:
    1px solid rgba(255,255,255,.1);

  backdrop-filter:blur(20px);

}

.stat small {

  color:#858594;

}

.stat strong {

  display:block;

  margin-top:10px;

  font-size:38px;

}

.links {

  margin-top:30px;

}

.linkCard {

  padding:25px;

  margin-bottom:15px;

  border-radius:20px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid rgba(255,255,255,.08);

}

.linkTop {

  display:flex;

  justify-content:space-between;

  align-items:center;

}

.status {

  padding:7px 12px;

  border-radius:20px;

  font-size:12px;

}

.active {

  background:
    rgba(34,197,94,.12);

  color:#4ade80;
}

.stopped {

  background:
    rgba(239,68,68,.12);

  color:#f87171;
}

.activity {

  margin-top:20px;

}

.event {

  padding:12px 0;

  border-bottom:
    1px solid rgba(255,255,255,.06);

  color:#aaa;

}

.stopBtn {

  border:none;

  padding:9px 14px;

  border-radius:10px;

  cursor:pointer;

}

@media(max-width:700px){

  .stats{
    grid-template-columns:1fr;
  }

  .dashboardHeader{
    align-items:flex-start;
    gap:20px;
    flex-direction:column;
  }

}

</style>

</head>


<body>

<header class="navbar">

  <div class="brand">

    <span class="brandIcon">✦</span>

    LinkNova

  </div>

  <a
    href="index.html"
    class="navButton"
  >
    Create Link
  </a>

</header>


<main class="dashboard">

<div class="dashboardHeader">

  <div>

    <div class="badge">
      LIVE ANALYTICS
    </div>

    <h1>
      Your Dashboard
    </h1>

  </div>

</div>


<section class="stats">

  <div class="stat">

    <small>Total Clicks</small>

    <strong id="totalClicks">
      0
    </strong>

  </div>


  <div class="stat">

    <small>Active Links</small>

    <strong id="activeLinks">
      0
    </strong>

  </div>


  <div class="stat">

    <small>Countries</small>

    <strong id="countries">
      0
    </strong>

  </div>

</section>


<section
  class="links"
  id="links"
></section>

</main>


<script src="dashboard.js"></script>

</body>

</html>
