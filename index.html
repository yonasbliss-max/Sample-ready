<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>St. Xavier's Church</title>

<style>

/* =========================================================
   BASIC
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    font-family:
        "Noto Sans Tamil",
        "Segoe UI",
        Arial,
        sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(255,255,255,.09),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #07080c,
            #11131a 45%,
            #08090d
        );

    position:relative;
}


/* =========================================================
   GLASS BACKGROUND LIGHT
========================================================= */

body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;

    left:50%;
    top:45%;

    transform:translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.10),
            transparent 68%
        );

    filter:blur(50px);

    pointer-events:none;
    z-index:-5;
}


/* =========================================================
   MOVING BUBBLES
========================================================= */

.bubbles{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-2;
}

.bubble{
    position:absolute;

    width:var(--size);
    height:var(--size);

    left:var(--left);
    bottom:-150px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            rgba(255,255,255,.65),
            rgba(255,255,255,.12) 35%,
            rgba(255,255,255,.02) 70%
        );

    border:1px solid rgba(255,255,255,.18);

    box-shadow:
        inset 0 0 18px rgba(255,255,255,.15),
        0 0 30px rgba(255,255,255,.05);

    backdrop-filter:blur(3px);

    animation:
        bubbleMove var(--duration) linear infinite;

    animation-delay:var(--delay);
}

@keyframes bubbleMove{

    0%{
        transform:
            translate3d(0,0,0)
            scale(.7);
        opacity:0;
    }

    10%{
        opacity:.5;
    }

    50%{
        transform:
            translate3d(
                var(--move),
                -55vh,
                0
            )
            scale(1);
        opacity:.65;
    }

    100%{
        transform:
            translate3d(
                calc(var(--move) * -1),
                -120vh,
                0
            )
            scale(.85);
        opacity:0;
    }
}


/* =========================================================
   BUTTERFLIES
========================================================= */

.butterflies{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.butterfly{
    position:absolute;

    font-size:var(--size);

    left:-80px;
    top:var(--top);

    opacity:.5;

    filter:
        drop-shadow(
            0 0 10px
            rgba(255,255,255,.25)
        );

    animation:
        butterflyMove
        var(--duration)
        linear infinite;

    animation-delay:var(--delay);
}

@keyframes butterflyMove{

    0%{
        transform:
            translate3d(-80px,0,0)
            rotate(0deg);
        opacity:0;
    }

    10%{
        opacity:.55;
    }

    25%{
        transform:
            translate3d(25vw,-35px,0)
            rotate(10deg);
    }

    50%{
        transform:
            translate3d(50vw,45px,0)
            rotate(-8deg);
    }

    75%{
        transform:
            translate3d(75vw,-30px,0)
            rotate(10deg);
    }

    100%{
        transform:
            translate3d(
                calc(100vw + 100px),
                30px,
                0
            )
            rotate(-5deg);

        opacity:0;
    }
}


/* =========================================================
   TOP NAVIGATION
========================================================= */

.topbar{
    width:min(1180px,94%);
    margin:18px auto 0;

    padding:12px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;

    border:1px solid rgba(255,255,255,.18);

    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.035)
        );

    backdrop-filter:
        blur(28px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(28px)
        saturate(150%);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.20),
        0 15px 50px rgba(0,0,0,.35);

    position:relative;
    z-index:20;
}

.socials{
    display:flex;
    gap:8px;
}

.glass-btn{
    min-width:48px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0 18px;

    border-radius:17px;

    border:1px solid rgba(255,255,255,.20);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.16),
            rgba(255,255,255,.035)
        );

    color:white;

    font-size:20px;

    backdrop-filter:blur(20px);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.20),
        0 8px 25px rgba(0,0,0,.20);

    transition:.3s ease;

    cursor:pointer;
}

.glass-btn:hover,
.glass-btn:active{
    transform:translateY(-2px) scale(1.03);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.24),
            rgba(255,255,255,.08)
        );

    box-shadow:
        0 0 25px rgba(255,255,255,.13),
        inset 0 1px 0 rgba(255,255,255,.3);
}

.home-btn{
    font-size:15px;
    font-weight:700;
}

.menu-btn{
    font-size:15px;
}


/* =========================================================
   TITLE BAR
========================================================= */

.title-bar{
    width:min(1180px,94%);

    margin:16px auto;

    padding:17px;

    text-align:center;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.15);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.025)
        );

    backdrop-filter:blur(25px);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        0 10px 40px rgba(0,0,0,.22);

    font-weight:600;

    letter-spacing:.3px;
}


/* =========================================================
   MAIN GLASS CONTAINER
========================================================= */

.main-card{

    width:min(1180px,94%);

    min-height:720px;

    margin:35px auto 60px;

    padding:45px 30px;

    border-radius:38px;

    border:
        1px solid
        rgba(255,255,255,.20);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.105),
            rgba(255,255,255,.025)
        );

    backdrop-filter:
        blur(35px)
        saturate(130%);

    -webkit-backdrop-filter:
        blur(35px)
        saturate(130%);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.22),

        inset 0 0 80px
        rgba(255,255,255,.025),

        0 30px 100px
        rgba(0,0,0,.45);

    position:relative;

    overflow:hidden;
}


/* glass shine */

.main-card::before{

    content:"";

    position:absolute;

    width:65%;
    height:100%;

    top:-100%;
    left:-30%;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,.08),
            transparent
        );

    transform:rotate(15deg);

    animation:
        glassShine 8s ease-in-out infinite;

    pointer-events:none;
}

@keyframes glassShine{

    0%,60%{
        transform:
            translateX(-100%)
            rotate(15deg);
    }

    100%{
        transform:
            translateX(250%)
            rotate(15deg);
    }
}


/* =========================================================
   HEXAGON AREA
========================================================= */

.hex-area{

    width:min(850px,100%);

    aspect-ratio:1 / .92;

    margin:auto;

    position:relative;
}


/* =========================================================
   CENTER LOGO
========================================================= */

.center-logo{

    position:absolute;

    width:170px;
    height:170px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:30px;

    padding:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.25),
            rgba(255,255,255,.045)
        );

    border:
        1px solid
        rgba(255,255,255,.45);

    backdrop-filter:
        blur(25px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(25px)
        saturate(150%);

    box-shadow:

        0 0 0 8px
        rgba(255,255,255,.025),

        0 0 40px
        rgba(255,255,255,.12),

        inset 0 1px 0
        rgba(255,255,255,.5),

        0 20px 50px
        rgba(0,0,0,.45);

    z-index:10;

    overflow:hidden;

    animation:
        logoFloat 4s ease-in-out infinite;
}

.center-logo::after{

    content:"";

    position:absolute;

    width:70%;
    height:25%;

    top:-10%;
    left:-20%;

    background:
        rgba(255,255,255,.35);

    filter:blur(15px);

    transform:rotate(-30deg);

    animation:
        logoReflection 5s linear infinite;
}

.center-logo img{

    width:100%;
    height:100%;

    object-fit:contain;

    border-radius:20px;

    position:relative;
    z-index:2;

    filter:
        drop-shadow(
            0 5px 15px
            rgba(0,0,0,.4)
        );
}

@keyframes logoFloat{

    0%,100%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    50%{
        transform:
            translate(-50%,-52%)
            scale(1.025);
    }
}

@keyframes logoReflection{

    0%{
        left:-50%;
    }

    100%{
        left:130%;
    }
}


/* =========================================================
   HEX BOX
========================================================= */

.hex{

    position:absolute;

    width:255px;
    height:210px;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    cursor:pointer;

    transition:
        transform .45s ease,
        filter .45s ease;

    z-index:5;
}


/* actual hex background */

.hex::before{

    content:"";

    position:absolute;

    inset:0;

    clip-path:
        polygon(
            25% 4%,
            75% 4%,
            100% 50%,
            75% 96%,
            25% 96%,
            0 50%
        );

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.16),
            rgba(255,255,255,.035)
        );

    border:1px solid rgba(255,255,255,.15);

    backdrop-filter:blur(20px);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.20);
}


/* inner glass */

.hex::after{

    content:"";

    position:absolute;

    inset:9px;

    clip-path:
        polygon(
            25% 4%,
            75% 4%,
            100% 50%,
            75% 96%,
            25% 96%,
            0 50%
        );

    border:
        1px solid
        rgba(255,255,255,.10);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.012)
        );

    pointer-events:none;
}


/* =========================================================
   HEX CONTENT
========================================================= */

.hex-content{

    position:relative;

    z-index:3;

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:12px;
}

.hex-icon{

    width:58px;
    height:58px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.22),
            rgba(255,255,255,.045)
        );

    border:
        1px solid
        rgba(255,255,255,.32);

    box-shadow:

        inset 0 1px 0
        rgba(255,255,255,.35),

        0 10px 25px
        rgba(0,0,0,.20);

    font-size:27px;

    backdrop-filter:blur(18px);

    transition:.35s ease;
}

.hex-title{

    font-size:17px;

    font-weight:700;

    line-height:1.5;

    text-shadow:
        0 2px 8px
        rgba(0,0,0,.45);
}


/* =========================================================
   POSITIONING
========================================================= */

/* TOP */

.hex-1{
    left:50%;
    top:0;
    transform:translateX(-50%);
}

/* RIGHT TOP */

.hex-2{
    right:0;
    top:25%;
}

/* RIGHT BOTTOM */

.hex-3{
    right:5%;
    bottom:3%;
}

/* LEFT BOTTOM */

.hex-4{
    left:5%;
    bottom:3%;
}

/* LEFT TOP */

.hex-5{
    left:0;
    top:25%;
}

/* BOTTOM CENTER */

.hex-6{
    left:50%;
    bottom:-2%;
    transform:translateX(-50%);
}


/* =========================================================
   ACTIVE HEX GLOW
========================================================= */

.hex.active{

    filter:
        drop-shadow(
            0 0 18px
            rgba(255,255,255,.45)
        );
}

.hex.active::before{

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.30),
            rgba(255,255,255,.08)
        );

    box-shadow:
        0 0 35px
        rgba(255,255,255,.22),

        inset 0 0 25px
        rgba(255,255,255,.12);
}

.hex.active .hex-icon{

    transform:
        scale(1.12);

    box-shadow:

        0 0 25px
        rgba(255,255,255,.38),

        inset 0 0 18px
        rgba(255,255,255,.20);
}


/* =========================================================
   CONTINUOUS CLOCKWISE LIGHT PATH
========================================================= */

.light-path{

    position:absolute;

    left:50%;
    top:50%;

    width:650px;
    height:500px;

    transform:
        translate(-50%,-50%);

    pointer-events:none;

    z-index:7;
}


/* the single travelling light */

.light-dot{

    position:absolute;

    width:9px;
    height:90px;

    border-radius:100px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(255,255,255,.2),
            white
        );

    box-shadow:
        0 0 10px white,
        0 0 25px rgba(255,255,255,.65),
        0 0 45px rgba(255,255,255,.35);

    offset-path:
        path(
        "M325,5
         C535,5 650,95 650,250
         C650,405 535,495 325,495
         C115,495 0,405 0,250
         C0,95 115,5 325,5"
        );

    offset-rotate:auto;

    animation:
        pathMove 8s linear infinite;

    filter:blur(.2px);
}

@keyframes pathMove{

    from{
        offset-distance:0%;
    }

    to{
        offset-distance:100%;
    }
}


/* =========================================================
   SMALL LIGHT PARTICLE
========================================================= */

.light-dot::after{

    content:"";

    position:absolute;

    width:20px;
    height:20px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 12px white,
        0 0 30px white,
        0 0 50px rgba(255,255,255,.5);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .topbar{

        width:96%;

        padding:9px;

        border-radius:22px;
    }

    .socials{
        gap:5px;
    }

    .glass-btn{

        min-width:42px;

        width:42px;
        height:42px;

        padding:0;

        border-radius:15px;

        font-size:17px;
    }

    .home-btn,
    .menu-btn{

        width:auto;

        min-width:72px;

        padding:0 13px;

        font-size:12px;
    }

    .title-bar{

        width:96%;

        font-size:13px;

        padding:14px 8px;
    }

    .main-card{

        width:96%;

        min-height:680px;

        padding:
            35px 8px;

        border-radius:30px;

        margin-top:25px;
    }

    .hex-area{

        width:100%;

        height:620px;

        aspect-ratio:auto;
    }

    .hex{

        width:150px;
        height:125px;
    }

    .hex-icon{

        width:42px;
        height:42px;

        border-radius:13px;

        font-size:20px;
    }

    .hex-title{

        font-size:12px;

        line-height:1.35;
    }

    .hex-1{
        top:5px;
    }

    .hex-2{
        right:-7px;
        top:23%;
    }

    .hex-3{
        right:4px;
        bottom:7%;
    }

    .hex-4{
        left:4px;
        bottom:7%;
    }

    .hex-5{
        left:-7px;
        top:23%;
    }

    .hex-6{
        bottom:-4px;
    }

    .center-logo{

        width:125px;
        height:125px;

        border-radius:25px;

        padding:8px;
    }

    .center-logo img{

        border-radius:17px;
    }

    .light-path{

        width:360px;
        height:430px;
    }

    .light-dot{

        width:5px;
        height:55px;

        offset-path:
        path(
        "M180,5
         C300,5 360,85 360,215
         C360,345 300,425 180,425
         C60,425 0,345 0,215
         C0,85 60,5 180,5"
        );

        animation-duration:7s;
    }
}


/* =========================================================
   SMALL PHONE
========================================================= */

@media(max-width:420px){

    .hex{

        width:138px;
        height:116px;
    }

    .hex-icon{

        width:39px;
        height:39px;

        font-size:18px;
    }

    .hex-title{

        font-size:11px;
    }

    .center-logo{

        width:115px;
        height:115px;
    }

    .hex-area{

        height:590px;
    }

    .light-path{

        width:330px;
        height:400px;
    }

    .light-dot{

        offset-path:
        path(
        "M165,5
         C275,5 330,80 330,200
         C330,320 275,395 165,395
         C55,395 0,320 0,200
         C0,80 55,5 165,5"
        );
    }
}

</style>
</head>

<script>

/* =========================================================
   PAGE NAVIGATION
========================================================= */

function goToPage(page){

    window.location.href = page;

}


function goHome(){

    window.location.href = "index.html";

}


function openPage(url){

    window.open(url,"_blank");

}


function toggleMenu(){

    /*
       இங்கே உன் பங்குத்தந்தை page-ன் filename
       மாற்றிக்கொள்ளலாம்.
    */

    window.location.href = "priests.html";

}


/* =========================================================
   AUTOMATIC ACTIVE HEX
   Based on moving light position
========================================================= */

const hexes =
    document.querySelectorAll(".hex");

const positions = [

    {
        x:50,
        y:8
    },

    {
        x:82,
        y:30
    },

    {
        x:78,
        y:78
    },

    {
        x:22,
        y:78
    },

    {
        x:18,
        y:30
    },

    {
        x:50,
        y:91
    }

];


/* =========================================================
   CLOCKWISE ACTIVE ANIMATION
========================================================= */

let activeIndex = 0;

function activateHex(){

    hexes.forEach(hex=>{
        hex.classList.remove("active");
    });

    if(hexes[activeIndex]){

        hexes[activeIndex]
            .classList.add("active");

    }

    activeIndex++;

    if(activeIndex >= hexes.length){

        activeIndex = 0;

    }

}


/*
   Light path 8 seconds.
   6 sections -> approximately
   1.33 sec per box.
*/

setInterval(
    activateHex,
    1333
);


/* First active box */

activateHex();


/* =========================================================
   TOUCH EFFECT
========================================================= */

hexes.forEach(hex=>{

    hex.addEventListener(
        "touchstart",
        function(){

            hexes.forEach(item=>{
                item.classList.remove("active");
            });

            this.classList.add("active");

        },
        {
            passive:true
        }
    );


    hex.addEventListener(
        "mouseenter",
        function(){

            hexes.forEach(item=>{
                item.classList.remove("active");
            });

            this.classList.add("active");

        }
    );

});


/* =========================================================
   PREVENT DOUBLE TAP ZOOM
========================================================= */

let lastTouchEnd = 0;

document.addEventListener(
    "touchend",
    function(event){

        const now =
            new Date().getTime();

        if(
            now - lastTouchEnd <= 300
        ){

            event.preventDefault();

        }

        lastTouchEnd = now;

    },
    false
);

</script>
